posts_per_day: 3
publish_status: future        # future (scheduled) or draft
max_retries: 3

models:
  planner: google/gemini-2.5-flash-lite
  vision_filter: google/gemini-2.5-flash-lite
  extractor: google/gemini-2.5-flash-lite   # pulls recipes out of pages that have no recipe markup
  writer: google/gemini-2.5-flash
  editor: google/gemini-2.5-flash           # second pass that line-edits every section (use a stronger model here for more polish)
  fallback: openai/gpt-5-mini

writer:
  polish: true                  # editor pass on every section
  hook_min_score: 4             # the intro's first line is scored 1-5 and rewritten until it reaches this

length:
  min_items: 6
  min_items_recipe: 5           # recipe posts need fewer items when only real recipes are used
  max_items: 20
  min_words_per_section: 70
  max_words_per_section: 180
  overhead_words: 350           # intro + closing + FAQ
  max_total_words: 3000

research:
  pages_to_fetch: 6

images:
  min_short_side: 600
  min_short_side_instagram: 400
  max_upscale: 1.0
  min_aspect: 0.6
  max_aspect: 2.5
  max_rounds: 12
  candidates_per_round: 40
  instagram_posts_per_round: 10
  max_vision_checks_per_keyword: 120
  phash_distance: 8
  max_total_uses: 2
  cooldown_days: 30
  max_images_per_domain: 2
  max_failures_per_domain: 3
  enable_google_images: true
  enable_research_pages: true
  enable_instagram: true
  enable_pexels: false

  # --- recipe posts: real recipes found by search come first ---
  allow_ai_recipes: false       # false = real recipes only. true = top up with recipes the AI invents (strict safety rules)
  max_ai_recipes: 5
  ai_recipe_max_rounds: 6
  screen_real_recipes: false    # true = reject real recipes containing onion, garlic, raw meat, salt, etc.
  qualifier_mode: prefer        # keyword says "small dogs"/"senior cats"...: prefer = pages that mention it first, require = only those, off = ignore
  max_recipes_per_domain: 2
  max_recipes_per_page: 2
  max_recipe_fetches_per_keyword: 40
  image_search_recipe_pages: true  # also find recipe pages through Google Images (single-recipe pages rank better there)
  fetch_workers: 6              # pages fetched in parallel
  llm_extraction: true          # read recipes from pages without recipe markup
  llm_extraction_max_pages: 10  # cost cap for that fallback, per keyword
  skip_shop_blog_pages: true    # skip /blogs/ and ?srsltid= pages (shop blogs, almost never real recipes)
  max_seconds_per_keyword: 1500 # stop searching after 25 minutes

costs:
  max_cost_per_run_usd: 2.0
  # Set these from your Bright Data plan. They are only used to estimate spend.
  brightdata_serp_per_request: 0.0015
  brightdata_unlocker_per_request: 0.0015
  brightdata_dataset_per_record: 0.0015

wordpress:
  categories: ["Home Decor", "Pets"]
  meta_description_key: ""      # e.g. _yoast_wpseo_metadesc (needs the key registered for REST)
  author_display_name: ""       # e.g. "Pet Home Studio"; empty keeps the account's name (may be an email)
