name: Daily content run

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC every day (GitHub cron uses UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no WordPress publishing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: content-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          PYTHONPATH: src
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_SERP_ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
          BRIGHTDATA_UNLOCKER_ZONE: ${{ secrets.BRIGHTDATA_UNLOCKER_ZONE }}
          BRIGHTDATA_IG_DATASET_ID: ${{ secrets.BRIGHTDATA_IG_DATASET_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m pinpipe.main --dry-run
          else
            python -m pinpipe.main
          fi
      - name: Upload dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: output/
      - name: Commit state
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add state.json image_usage.json logs/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update state [skip ci]" && git pull --rebase && git push)
