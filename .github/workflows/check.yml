name: Check code

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "config.yaml"
      - "requirements.txt"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyflakes pytest
      - name: Syntax and unused/undefined names
        run: |
          python -m compileall -q src
          python -m pyflakes src
      - name: Config loads and has every key the code reads
        run: PYTHONPATH=src python -c "from pinpipe.config import load_config; c=load_config('config.yaml'); [c[k] for k in ('models','length','images','costs','wordpress','research')]; print('config ok')"
      - name: Tests
        run: PYTHONPATH=src pytest -q
